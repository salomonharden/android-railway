[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
```

**Step 4:** Click **"Commit new file"**

---

### PART 4: DEPLOY ON RAILWAY (5 minutes)

**Step 1:** Go back to https://railway.app/dashboard

**Step 2:** Click **"New Project"** (purple button, top right)

**Step 3:** Click **"Deploy from GitHub repo"**

**Step 4:** Click **"Configure GitHub App"**

**Step 5:** On GitHub page:
- Find "Repository access"
- Select **"Only select repositories"**
- Click dropdown, find `android-railway`
- Check the box next to it
- Click green **"Save"** button at bottom

**Step 6:** You'll return to Railway. Click **"Deploy from GitHub repo"** again

**Step 7:** You'll see your `android-railway` repository. Click it.

**Step 8:** Click **"Deploy Now"**

**Step 9:** Wait 2-5 minutes. You'll see logs scrolling. Wait for it to say "SUCCESS" or show green checkmark.

---

### PART 5: GET PUBLIC URL (2 minutes)

**Step 1:** On Railway dashboard, click your `android-railway` service (the card showing it)

**Step 2:** Click **"Settings"** tab (top menu)

**Step 3:** Scroll down to **"Networking"** section

**Step 4:** Under "Public Networking", click **"Generate Domain"**

**Step 5:** You'll see a URL appear like: `android-railway-production-xxxx.up.railway.app`

**Step 6:** Copy this URL EXACTLY

---

### PART 6: ACCESS ANDROID (3 minutes)

**Step 1:** Open new browser tab

**Step 2:** Type this URL (replace YOUR-URL with what you copied):
```
https://YOUR-URL/vnc.html
```

Example:
```
https://android-railway-production-a1b2.up.railway.app/vnc.html
```

**Step 3:** You'll see a black screen with "Connect" button

**Step 4:** Click **"Connect"**

**Step 5:** Wait 30-60 seconds. You'll see Android-x86 boot menu appear.

---

### PART 7: INSTALL ANDROID (15 minutes)

Now you're looking at Android installer in your browser.

**Step 1:** You'll see text menu with options. Use arrow keys on your keyboard.

**Step 2:** Press **Down Arrow** to highlight: `Installation - Install Android-x86 to harddisk`

**Step 3:** Press **Enter**

**Step 4:** You'll see: "Choose Partition". Press **Down Arrow** to select `Create/Modify partitions`

**Step 5:** Press **Enter**

**Step 6:** You'll see gdisk screen with text. Type exactly: `n` then press **Enter**

**Step 7:** Press **Enter** (accept default partition number)

**Step 8:** Press **Enter** (accept default first sector)

**Step 9:** Press **Enter** (accept default last sector)

**Step 10:** Press **Enter** (accept default hex code)

**Step 11:** Type: `w` then press **Enter**

**Step 12:** Type: `Y` then press **Enter**

**Step 13:** You're back at partition menu. Select `sda1` and press **Enter**

**Step 14:** Select `ext4` and press **Enter**

**Step 15:** Select `Yes` for "Do you want to format?" Press **Enter**

**Step 16:** Select `Yes` for "Install GRUB?" Press **Enter**

**Step 17:** Select `Yes` for "read-write system?" Press **Enter**

**Step 18:** Wait 5-10 minutes for installation. You'll see progress.

**Step 19:** When done, you'll see "Create a fake SD card?" Select `Skip` and press **Enter**

**Step 20:** Select `Reboot` and press **Enter**

---

### PART 8: FINAL CONFIGURATION (5 minutes)

After reboot, Android might not start automatically. Here's how to fix it:

**Step 1:** Go back to Railway dashboard

**Step 2:** Click your service

**Step 3:** Click **"..."** (three dots, top right)

**Step 4:** Click **"Restart"**

**Step 5:** Wait 2 minutes

**Step 6:** Go back to your browser tab with VNC

**Step 7:** Refresh the page

**Step 8:** Click **"Connect"** again

**Step 9:** You should see Android booting! Wait for Android setup screen.

**Step 10:** Complete Android setup:
- Select language
- Skip Google login (or sign in if you want)
- Accept terms
- Wait for home screen

---

## YOU'RE DONE!

You now have Android running with full UI in your browser.

**Your URL to access anytime:**
